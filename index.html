<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sky Rails</title>
<style>
html,body{margin:0;height:100%;background:#050816;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#game{display:block;width:100vw;height:100vh}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.65)}
button{padding:14px 28px;border:none;border-radius:10px;background:#00e5ff;color:#000;font-weight:bold;cursor:pointer}
#hud{position:absolute;top:10px;left:10px;font-weight:bold;text-shadow:0 0 8px #0ff}
.hidden{display:none}
h1{color:#0ff;text-shadow:0 0 20px #0ff}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
<div>Pontuação: <span id="score">0</span></div>
<div>Distância: <span id="dist">0</span>m</div>
<div>Lumens: <span id="lumens">0</span></div>
<div>Recorde: <span id="best">0</span></div>
</div>

<div id="menu" class="overlay">
<h1>SKY RAILS</h1>
<p>Kai Volt • Endless Runner Neon</p>
<button onclick="startGame()">Jogar</button>
</div>

<div id="gameover" class="overlay hidden">
<h1>GAME OVER</h1>
<p id="finalScore"></p>
<button onclick="startGame()">Reiniciar</button>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

const lanes=[-1,0,1];
let best=+localStorage.getItem('skyrails_best')||0;
document.getElementById('best').textContent=best;

let game;

function beep(f=440,d=0.08){
 const a=new (window.AudioContext||window.webkitAudioContext)();
 const o=a.createOscillator(),g=a.createGain();
 o.frequency.value=f;o.connect(g);g.connect(a.destination);
 o.start();g.gain.setValueAtTime(.03,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
 o.stop(a.currentTime+d);
}

function startGame(){
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('gameover').classList.add('hidden');
 document.getElementById('hud').classList.remove('hidden');

 game={
 lane:1,y:0,vy:0,jump:false,slide:0,
 score:0,dist:0,lumens:0,speed:8,
 objects:[],particles:[],shield:0,magnet:0,turbo:0,
 over:false
 };
 loop();
}

function spawn(){
 const r=Math.random();
 const lane=Math.floor(Math.random()*3);
 let type='lumen';
 if(r>.45&&r<.65) type='drone';
 else if(r>=.65&&r<.8) type='barrier';
 else if(r>=.8&&r<.9) type='rail';
 else if(r>=.9&&r<.95) type='shield';
 else if(r>=.95&&r<.975) type='magnet';
 else if(r>=.975) type='turbo';
 game.objects.push({lane,z:120,type});
}

setInterval(()=>{if(game&&!game.over)spawn()},600);

addEventListener('keydown',e=>{
 if(!game||game.over)return;
 if(e.key==="ArrowLeft"||e.key==="a") game.lane=Math.max(0,game.lane-1);
 if(e.key==="ArrowRight"||e.key==="d") game.lane=Math.min(2,game.lane+1);
 if((e.key===" "||e.key==="ArrowUp")&&!game.jump){game.vy=14;game.jump=true;beep(700)}
 if(e.key==="ArrowDown") game.slide=25;
});

function hitObstacle(){
 if(game.shield>0){game.shield=300;return;}
 game.over=true;
 best=Math.max(best,Math.floor(game.score));
 localStorage.setItem('skyrails_best',best);
 document.getElementById('finalScore').textContent="Pontuação: "+Math.floor(game.score);
 document.getElementById('gameover').classList.remove('hidden');
 beep(120,.3);
}

function draw(){
 ctx.fillStyle="#050816";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 for(let i=0;i<60;i++){
   ctx.fillStyle="rgba(0,255,255,.15)";
   ctx.fillRect((i*150+(game.dist*2)%150)%canvas.width,50+Math.sin(i)*40,20,200);
 }

 const cx=canvas.width/2;
 const horizon=120;

 for(let i=0;i<3;i++){
   const x=cx+(i-1)*120;
   ctx.strokeStyle="#00ffff";
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.moveTo(x-80,canvas.height);
   ctx.lineTo(x,horizon);
   ctx.stroke();
 }

 game.objects.forEach(o=>{
   const scale=Math.max(.1,1-o.z/130);
   const x=cx+(o.lane-1)*120*scale;
   const y=canvas.height-(o.z*5);

   if(o.type==="lumen"){ctx.fillStyle="#ffff00";ctx.beginPath();ctx.arc(x,y,10*scale+3,0,7);ctx.fill();}
   else if(o.type==="drone"){ctx.fillStyle="#ff00ff";ctx.fillRect(x-15*scale,y-10*scale,30*scale,20*scale);}
   else if(o.type==="barrier"){ctx.fillStyle="#ff3333";ctx.fillRect(x-20*scale,y-25*scale,40*scale,50*scale);}
   else if(o.type==="rail"){ctx.fillStyle="#ff8800";ctx.fillRect(x-25*scale,y-10*scale,50*scale,20*scale);}
   else if(o.type==="shield"){ctx.fillStyle="#00ff99";ctx.beginPath();ctx.arc(x,y,12*scale,0,7);ctx.stroke();}
   else if(o.type==="magnet"){ctx.fillStyle="#66aaff";ctx.fillRect(x-10*scale,y-15*scale,20*scale,30*scale);}
   else if(o.type==="turbo"){ctx.fillStyle="#ffffff";ctx.fillRect(x-10*scale,y-10*scale,20*scale,20*scale);}
 });

 const px=cx+(game.lane-1)*120;
 const py=canvas.height-140-game.y*4;
 ctx.fillStyle="#00e5ff";
 ctx.fillRect(px-15,py-40+(game.slide?20:0),30,40);
 ctx.fillStyle="#fff";
 ctx.fillRect(px-10,py-55+(game.slide?20:0),20,15);

 if(game.shield>0){
   ctx.strokeStyle="#00ff99";
   ctx.beginPath();ctx.arc(px,py-20,35,0,7);ctx.stroke();
 }
}

function update(){
 game.speed+=0.001;
 if(game.turbo>0){game.speed+=0.02;game.turbo--;}
 if(game.shield>0)game.shield--;
 if(game.magnet>0)game.magnet--;

 game.score+=0.1*game.speed;
 game.dist+=0.05*game.speed;

 game.vy-=0.7;
 game.y+=game.vy;
 if(game.y<=0){game.y=0;game.vy=0;game.jump=false;}
 if(game.slide>0)game.slide--;

 game.objects.forEach(o=>o.z-=game.speed);
 game.objects=game.objects.filter(o=>{
   if(o.z<8 && o.lane===game.lane){
      if(o.type==="lumen"){game.lumens++;game.score+=25;beep(900);return false;}
      if(o.type==="shield"){game.shield=300;return false;}
      if(o.type==="magnet"){game.magnet=400;return false;}
      if(o.type==="turbo"){game.turbo=250;return false;}
      if(["drone","barrier","rail"].includes(o.type) && game.y<8) hitObstacle();
   }
   return o.z>-10;
 });

 document.getElementById('score').textContent=Math.floor(game.score);
 document.getElementById('dist').textContent=Math.floor(game.dist);
 document.getElementById('lumens').textContent=game.lumens;
 document.getElementById('best').textContent=best;
}

function loop(){
 if(!game||game.over)return;
 update();
 draw();
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
